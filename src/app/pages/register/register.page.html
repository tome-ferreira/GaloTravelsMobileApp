<ion-content class="ion-padding" style="text-align: center;">
  <img
    src="assets/LogoWBackground.png"
    style="width: 200px; height: auto; margin: 30px auto 20px;"
  />

  <h6 style="font-weight: bold; margin-top: 10px; color: #000; font-size: 1.8rem;">Create Account</h6>

  <!-- Form -->
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" style="max-width: 400px; margin: 20px auto;">
    <!-- Email -->
    <div style="margin-bottom: 20px; text-align: left; position: relative;">
      <div style="display: flex; align-items: center; margin-bottom: 5px;">
        <ion-icon name="at-outline" style="color: #aaa; font-size: 1.2rem; margin-right: 10px;"></ion-icon>
        <label for="email" style="color: #555; font-size: 1rem;">Email</label>
      </div>
      <input
        type="email"
        id="email"
        formControlName="email"
        style="width: 100%; padding: 10px 10px 10px 20px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; background-color: #DCDCDC;"
      />
    </div>

    <!-- Username -->
    <div style="margin-bottom: 20px; text-align: left; position: relative;">
      <div style="display: flex; align-items: center; margin-bottom: 5px;">
        <ion-icon name="mail" style="color: #aaa; font-size: 1.2rem; margin-right: 10px;"></ion-icon>
        <label for="username" style="color: #555; font-size: 1rem;">Username</label>
      </div>
      <input
        id="username"
        formControlName="username"
        style="width: 100%; padding: 10px 10px 10px 20px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; background-color: #DCDCDC;"
      />
    </div>

    <!-- First Name and Last Name -->
    <div style="display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px;">
      <!-- First Name -->
      <div style="flex: 1; text-align: left; position: relative;">
        <div style="display: flex; align-items: center; margin-bottom: 5px;">
          <ion-icon name="person" style="color: #aaa; font-size: 1.2rem; margin-right: 10px;"></ion-icon>
          <label for="firstName" style="color: #555; font-size: 1rem;">First Name</label>
        </div>
        <input
          type="text"
          id="firstName"
          formControlName="firstName"
          style="width: 100%; padding: 10px 10px 10px 20px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; background-color: #DCDCDC;"
        />
      </div>

      <!-- Last Name -->
      <div style="flex: 1; text-align: left; position: relative;">
        <div style="display: flex; align-items: center; margin-bottom: 5px;">
          <ion-icon name="person" style="color: #aaa; font-size: 1.2rem; margin-right: 10px;"></ion-icon>
          <label for="lastName" style="color: #555; font-size: 1rem;">Last Name</label>
        </div>
        <input
          type="text"
          id="lastName"
          formControlName="lastName"
          style="width: 100%; padding: 10px 10px 10px 20px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; background-color: #DCDCDC;"
        />
      </div>
    </div>

    <!-- Password -->
    <div style="margin-bottom: 20px; text-align: left; position: relative;">
      <div style="display: flex; align-items: center; margin-bottom: 5px;">
        <ion-icon name="lock-closed" style="color: #aaa; font-size: 1.2rem; margin-right: 10px;"></ion-icon>
        <label for="password" style="color: #555; font-size: 1rem;">Password</label>
      </div>
      <input
        type="password"
        id="password"
        formControlName="password"
        style="width: 100%; padding: 10px 10px 10px 20px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; background-color: #DCDCDC;"
      />
    </div>

    <!-- Confirm Password -->
    <div style="margin-bottom: 20px; text-align: left; position: relative;">
      <div style="display: flex; align-items: center; margin-bottom: 5px;">
        <ion-icon name="lock-closed" style="color: #aaa; font-size: 1.2rem; margin-right: 10px;"></ion-icon>
        <label for="confirmPassword" style="color: #555; font-size: 1rem;">Confirm Password</label>
      </div>
      <input
        type="password"
        id="confirmPassword"
        formControlName="confirmPassword"
        style="width: 100%; padding: 10px 10px 10px 20px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; background-color: #DCDCDC;"
      />
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      style="background-color: #d32f2f; color: white; font-size: 1rem; border-radius: 30px; height: 50px; width: 200px; border: none; font-weight: 600; margin-top: 20px; transition: background-color 0.3s ease; display: inline-block; margin: 20px auto;">
      Create Account
    </button>
  </form>

  <p style="margin-top: 20px; font-size: 0.9rem; color: #333;">
    Already have an account? 
    <a href="#" style="color: #d32f2f; text-decoration: none;">Log in</a>
  </p>
</ion-content>
