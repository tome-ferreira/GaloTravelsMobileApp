<ion-tabs>

  <!--Página 1-->
  <ion-tab tab="home">
    <div id="home-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Início</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="example-content">Listen now content</div>
      </ion-content>
    </div>
  </ion-tab>






  <!--Página 2-->
  <ion-tab tab="radio">
    <div id="radio-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Minhas viagens</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="example-content">Radio content</div>
      </ion-content>
    </div>
  </ion-tab>









  <!--Página 3-->
  <ion-tab tab="library">
    <div id="library-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Library</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="example-content">Library content</div>
      </ion-content>
    </div>
  </ion-tab>








  <!--Página 4-->
  <ion-tab tab="search">
    <div id="search-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Search</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="example-content">Search content</div>
      </ion-content>
    </div>
  </ion-tab>












  <ion-tab-bar slot="bottom" class="tab-bar">
    <ion-tab-button tab="home">
      <ion-icon name="home"></ion-icon>
      Início
    </ion-tab-button>
    <ion-tab-button tab="radio">
      <ion-icon name="airplane-outline"></ion-icon>
      Viagens
    </ion-tab-button>
    <ion-tab-button tab="library">
      <ion-icon name="add-circle"></ion-icon>
      3
    </ion-tab-button>
    <ion-tab-button tab="search">
      <ion-icon name="person-circle"></ion-icon>
      4
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
